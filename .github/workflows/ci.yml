name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-checks:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Typecheck Client (TypeScript)
        run: npx tsc --noEmit -p client/tsconfig.json

      - name: Run Client Vitest Tests
        run: npm run test:run --workspace=hero_manager_client